name: Build Xenon desktop apps

# Builds the Windows, Linux and macOS installers from the web/ project with Tauri.
# Run it from the Actions tab ("Run workflow"), or push a tag such as v1.0.0 to also create a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # lets the Tauri action create the draft release

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: '--target universal-apple-darwin' }
          - { platform: ubuntu-22.04, args: '' }
          - { platform: windows-latest, args: '' }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'web/src-tauri -> target' }
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: web
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Xenon {0}', github.ref_name) || '' }}
          releaseBody: 'Windows (.msi, .exe), Linux (.deb, .rpm, .AppImage) and macOS (.dmg). Not code-signed: see the README for first-launch steps.'
          releaseDraft: true
      - name: Keep the installers from this run
        uses: actions/upload-artifact@v4
        with:
          name: xenon-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            web/src-tauri/target/release/bundle/msi/*.msi
            web/src-tauri/target/release/bundle/nsis/*.exe
            web/src-tauri/target/release/bundle/deb/*.deb
            web/src-tauri/target/release/bundle/rpm/*.rpm
            web/src-tauri/target/release/bundle/appimage/*.AppImage
            web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
