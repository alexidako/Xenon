[package]
name = "xenon"
version = "1.0.2"
description = "Xenon: a chemistry reference and learning app"
authors = ["pupper"]
license = "GPL-2.0-or-later"
edition = "2021"

[lib]
name = "xenon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
